name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ----------------------------------------------------------------------
  # Job 1: Test
  # Runs automated tests with pytest on every push and pull request.
  # ----------------------------------------------------------------------
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -v

  # ----------------------------------------------------------------------
  # Job 2: Build and Push Docker Image
  # Builds Docker image and pushes it to GitHub Container Registry (GHCR)
  # or Docker Hub on push to main or manual workflow_dispatch.
  # ----------------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set repository image name (lowercased)
        run: |
          # GHCR requires repository names to be lowercase
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Login to GitHub Container Registry (GHCR)
      # Uses the built-in GITHUB_TOKEN - no extra secret configuration required!
      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------
      # Optional: Docker Hub Login
      # To push to Docker Hub instead of or in addition to GHCR:
      # 1. Add DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to your GitHub Secrets.
      # 2. Uncomment this step and add your Docker Hub image to metadata-action.
      # ------------------------------------------------------------------
      # - name: Log in to Docker Hub
      #   if: "${{ secrets.DOCKERHUB_USERNAME != '' }}"
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------
  # Job 3: Automated Deploy (SSH Plus)
  # Connects to your remote server via SSH, pulls the newly pushed image,
  # gracefully updates the container with persistent storage, verifies
  # container health, and prunes unused images.
  # ----------------------------------------------------------------------
  deploy:
    name: Automated Deploy via SSH
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Set lowercased target image
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV

      - name: Execute Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: IMAGE_NAME,SECRET_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,COOKIE_SECURE,GITHUB_ACTOR,GITHUB_TOKEN
          script: |
            echo "=========================================================="
            echo "🚀 Starting Automated Deployment for Rural Banking System"
            echo "Target Image: $IMAGE_NAME"
            echo "=========================================================="

            # Authenticate with GHCR if GITHUB_TOKEN is present
            if [ -n "$GITHUB_TOKEN" ]; then
              echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin 2>/dev/null || true
            fi

            # 1. Pull the newest image from the registry
            echo "📥 Step 1: Pulling latest image..."
            docker pull "$IMAGE_NAME"

            # 2. Stop and remove existing container if running
            echo "🛑 Step 2: Stopping previous container instance..."
            docker stop rural-banking 2>/dev/null || true
            docker rm rural-banking 2>/dev/null || true

            # 3. Run updated container with persistent volume for SQLite data
            echo "▶️ Step 3: Starting updated container..."
            docker run -d \
              --name rural-banking \
              --restart unless-stopped \
              -p 5000:5000 \
              -v rural_banking_data:/data \
              -e DATABASE_PATH="/data/banking.db" \
              -e SECRET_KEY="${SECRET_KEY}" \
              -e ADMIN_USERNAME="${ADMIN_USERNAME:-admin}" \
              -e ADMIN_PASSWORD="${ADMIN_PASSWORD}" \
              -e COOKIE_SECURE="${COOKIE_SECURE:-false}" \
              "$IMAGE_NAME"

            # 4. SSH Plus: Verification and Health Check
            echo "⏳ Step 4: Verifying container health via /health endpoint..."
            sleep 6

            if ! docker ps -f name=rural-banking --format '{{.Status}}' | grep -qi "Up"; then
              echo "❌ Error: Container failed to stay up. Showing logs:"
              docker logs --tail 50 rural-banking
              exit 1
            fi

            if docker exec rural-banking curl -sf http://localhost:5000/health > /dev/null; then
              echo "✅ Rural Banking container and /health endpoint are healthy!"
            else
              echo "❌ Error: Health check endpoint failed. Showing logs:"
              docker logs --tail 50 rural-banking
              exit 1
            fi

            # 5. SSH Plus: Maintenance & image cleanup
            echo "🧹 Step 5: Pruning old dangling images..."
            docker image prune -f

            echo "=========================================================="
            echo "🎉 Deployment finished successfully!"
            echo "=========================================================="
