
{% extends "base.html" %}

{% block title %}Register | RuralBank{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="icon">🏡</div>
    <h1>Open an Account</h1>
    <p class="muted">Join our simple rural banking demo.</p>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" maxlength="80" required>

        <label>Username</label>
        <input type="text" name="username" placeholder="Choose a username" maxlength="30" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="At least 8 characters" minlength="8" required>

        <button class="primary-button" type="submit">Create Account</button>
    </form>

    <p class="switch">Already registered? <a href="{{ url_for('login') }}">Login</a></p>

    <small>New accounts start with a fictional demo balance of ₹10,000.</small>
</div>
{% endblock %}
